*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#F2F6FF;overscroll-behavior:none;}
body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}

.app{--ink:#2B3A67;--soft:#7E8CB5;--line:#D8E2F7;--paper:#F2F6FF;--card:#fff;
  --g:#3E7BF0;--gd:#2A5FCC;
  height:100%;display:flex;flex-direction:column;
  font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
input{font-family:inherit;}
:focus-visible{outline:3px solid #FF8A3D;outline-offset:2px;}
.num{font-family:'Fredoka','Gowun Dodum',sans-serif;font-weight:500;}

/* ══ 헤더 ══ */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--card);border-bottom:2px solid var(--line);}
.bicon{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:var(--g);color:#fff;
  display:grid;place-items:center;box-shadow:0 3px 0 var(--gd);}
.bicon:active{transform:translateY(3px);box-shadow:none;}
.pos-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:48px;
  padding:0 14px;border:2.5px solid var(--line);border-radius:15px;background:var(--paper);
  box-shadow:0 3px 0 var(--line);text-align:left;}
.pos-btn:active{transform:translateY(3px);box-shadow:none;filter:brightness(.96);}
.gtag{flex:none;font-family:'Jua',sans-serif;font-size:13px;padding:4px 10px;border-radius:999px;color:#fff;background:var(--g);}
.uno{flex:none;font-family:'Fredoka',sans-serif;font-size:13px;color:var(--soft);}
.unm{flex:none;font-size:14px;color:var(--soft);}
.sep{flex:none;color:var(--line);}
.inm{font-family:'Jua',sans-serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.caret{flex:none;margin-left:auto;color:var(--soft);font-size:13px;}
.info-btn{flex:none;min-height:48px;padding:0 15px;border-radius:15px;border:2.5px solid var(--line);
  background:var(--card);font-size:14px;}
.info-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.info-btn:active{filter:brightness(.94);}

/* ══ 내용 ══ */
.stage{flex:1;min-height:0;position:relative;padding:10px 12px 6px;display:flex;}
.slot{flex:1;min-height:0;background:var(--card);border:2.5px solid var(--line);border-radius:20px;
  padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.slot-head{flex:none;display:flex;align-items:baseline;gap:10px;}
.slot-head h1{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:23px;}
.slot-head .crumb{font-size:11.5px;color:var(--soft);margin:0;}
.badge{margin-left:auto;flex:none;font-size:11.5px;padding:5px 11px;border-radius:999px;}
.badge.card{background:#E4EDFF;color:#2A5FCC;}
.ph{flex:1;min-height:0;border:3px dashed var(--line);border-radius:16px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  color:var(--soft);padding:18px;}
.ph .ic{font-size:38px;opacity:.5;}
.ph p{margin:0;font-size:15px;line-height:1.9;}

.sheet{position:absolute;z-index:30;left:12px;right:12px;top:10px;max-height:calc(100% - 20px);
  overflow-y:auto;background:var(--card);border:2.5px solid var(--line);border-radius:18px;
  padding:16px 18px;box-shadow:0 14px 36px rgba(43,58,103,.2);display:none;}
.sheet.open{display:block;}
.sheet h3{margin:0 0 8px;font-size:12px;font-weight:400;color:var(--soft);}
.sheet ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
.sheet li{font-size:13.5px;line-height:1.65;display:flex;gap:8px;}
.code{flex:none;font-family:'Fredoka',sans-serif;font-size:11px;padding:3px 8px;border-radius:8px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--soft);}

/* ══ 데모 공통 ══ */
.dm{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:14px;}
.dm.wide{grid-template-columns:1fr;}
.dv{min-height:0;display:flex;flex-direction:column;gap:9px;}
.dc{min-height:0;display:flex;flex-direction:column;gap:9px;overflow-y:auto;}
.dsvg{flex:1;min-height:0;width:100%;height:100%;display:block;}
.row{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{min-height:46px;padding:0 15px;border-radius:14px;border:2.5px solid var(--line);
  background:var(--card);font-family:'Jua',sans-serif;font-size:14px;box-shadow:0 4px 0 var(--line);}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none;}
.btn:disabled{opacity:.4;box-shadow:none;}
.btn.p{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);}
.rbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);
  font-size:17px;line-height:1;box-shadow:0 3px 0 var(--line);flex:none;}
.rbtn:active{transform:translateY(3px);box-shadow:none;}
.seg2{display:flex;background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap;}
.seg2 button{min-height:40px;padding:0 13px;border:0;border-radius:11px;background:transparent;
  font-family:'Jua',sans-serif;font-size:13.5px;color:var(--soft);}
.seg2 button.on{background:var(--g);color:#fff;}
.seg2 button:active{filter:brightness(.94);}
.sl{display:flex;flex-direction:column;gap:4px;flex:none;}
.sl .t{display:flex;justify-content:space-between;align-items:baseline;}
.sl .t label{font-size:12.5px;color:var(--soft);}
.sl .t b{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--g);font-weight:500;}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:13px;border-radius:999px;
  background:var(--line);outline:none;touch-action:pan-x;}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--g);border:4px solid #fff;box-shadow:0 2px 6px rgba(43,58,103,.3);}
.sl input::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--g);border:4px solid #fff;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:2.5px solid var(--line);border-radius:11px;padding:6px 11px;font-size:14px;background:#fff;

.svgn{fill:#2B3A67;font-family:'Fredoka',sans-serif;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}
.svgn.sm{font-size:13px;fill:#7E8CB5;}
.svgt{font-family:'Jua',sans-serif;font-size:17px;fill:#2B3A67;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}

.foot{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px;

.arw:active:not(:disabled){transform:translateY(4px);box-shadow:none;}

.dots{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;overflow-x:auto;padding:2px;}

.meter{flex:none;width:124px;text-align:right;font-size:11.5px;color:var(--soft);}
.meter b{font-family:'Fredoka',sans-serif;font-size:15px;color:var(--ink);font-weight:500;}
.bar{display:block;height:7px;border-radius:999px;background:var(--line);margin-top:4px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:999px;background:var(--g);}

.picker{position:fixed;inset:0;z-index:80;background:#fff;display:none;}

.rail{flex:1 1 54%;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;

/* ══ 공용 도구 ══ */
var H = {
  r1: function (v) { return Math.round(v * 10) / 10; },
  r2: function (v) { return Math.round(v * 100) / 100; },
  gcd: function (a, b) { return b ? H.gcd(b, a % b) : Math.abs(a); },
  sl: function (id, label, min, max, step, val, suf) {
    return '<div class="sl"><div class="t"><label>' + label + '</label><b id="' + id + '_v">' + val + (suf || "") +
      '</b></div><input id="' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step +
      '" value="' + val + '"></div>';
  },
  seg: function (id, opts, val) {
    return '<div class="seg2" id="' + id + '">' + opts.map(function (o) {
      return '<button data-v="' + o[0] + '"' + (o[0] === val ? ' class="on"' : "") + ">" + o[1] + "</button>";
    }).join("") + "</div>";
  },
  onSeg: function (r, id, fn) {
    var el = r.querySelector("#" + id);
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]"); if (!b) return;
      el.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on"); fn(b.dataset.v);
    });
  },
  onSl: function (r, id, fn, suf) {
    var el = r.querySelector("#" + id), out = r.querySelector("#" + id + "_v");
    el.addEventListener("input", function () { out.textContent = this.value + (suf || ""); fn(+this.value); });
  },
  factor: function (n) {
    var f = [], x = n;
    for (var d = 2; d * d <= x; d++) { var c = 0; while (x % d === 0) { x /= d; c++; } if (c) f.push([d, c]); }
    if (x > 1) f.push([x, 1]);
    return f;
  },
  fstr: function (f) {
    return f.map(function (p) { return p[0] + (p[1] > 1 ? "<sup>" + p[1] + "</sup>" : ""); }).join(" × ");
  },
  divisors: function (n) { var a = []; for (var i = 1; i <= n; i++) if (n % i === 0) a.push(i); return a; },
  grid: function (px, py, R, W, pad) {
    var s = "";
    for (var i = -R; i <= R; i++) {
      if (i === 0) continue;
      s += '<line x1="' + px(i) + '" y1="' + pad + '" x2="' + px(i) + '" y2="' + (W - pad) + '" stroke="#E3EAF9" stroke-width="1.5"/>';
      s += '<line x1="' + pad + '" y1="' + py(i) + '" x2="' + (W - pad) + '" y2="' + py(i) + '" stroke="#E3EAF9" stroke-width="1.5"/>';
    }
    s += '<line x1="' + pad + '" y1="' + py(0) + '" x2="' + (W - pad) + '" y2="' + py(0) + '" stroke="#2B3A67" stroke-width="3"/>';
    s += '<line x1="' + px(0) + '" y1="' + pad + '" x2="' + px(0) + '" y2="' + (W - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
    return s;
  },
  arc: function (cx, cy, r, a0, a1) {
    var D = Math.PI / 180, p = function (a) { return [cx + r * Math.cos(a * D), cy + r * Math.sin(a * D)]; };
    var s = a1 - a0; while (s < 0) s += 360;
    var A = p(a0), B = p(a0 + s);
    return "M " + A[0] + " " + A[1] + " A " + r + " " + r + " 0 " + (s > 180 ? 1 : 0) + " 1 " + B[0] + " " + B[1];
  }
};

    '<p class="bb">2, 3, 5, 7 의 배수를 차례로 지우면 남는 수가 모두 소수예요. 이것이 에라토스테네스의 체입니다.</p>' +

  init: function (r) {
    var struck = {}, used = [], picked = null;

      var h = "";

        var out = n === 1 || struck[n];
        h += '<button data-n="' + n + '" style="aspect-ratio:1;min-height:38px;border-radius:10px;font-family:Fredoka,sans-serif;font-size:15px;' +
          (picked === n ? "background:#FF8A3D;border:2.5px solid #FF8A3D;color:#fff"
            : out ? "background:#F2F6FF;border:2.5px solid #D8E2F7;color:#7E8CB5;opacity:.45;text-decoration:line-through"
                  : "background:#FFF6EE;border:2.5px solid #FFD3AE;color:#FF8A3D") + '">' + n + "</button>";
      }
      r.querySelector("#grid").innerHTML = h;
      var p = next();
      r.querySelector("#go").textContent = p ? p + "의 배수 지우기" : "체 완성";
      r.querySelector("#go").disabled = !p;
      r.querySelector("#msg").innerHTML = used.length

      else {
        var f = H.factor(picked), prime = f.length === 1 && f[0][1] === 1;
        box.innerHTML = '<p class="s3 eq">' + picked + " = " + H.fstr(f) + "</p>" +
          '<p class="s1 ' + (prime ? "ok" : "hot") + '">' + (prime ? "소수" : "합성수") + " · 약수 " + H.divisors(picked).length + "개</p>";
      }
    }
    r.querySelector("#go").addEventListener("click", function () {
      var p = next(); if (!p) return;
      for (var m = p * 2; m <= 100; m += p) if (!struck[m]) struck[m] = p;
      used.push(p); draw();
    });

DEMOS["수직선과 절댓값"] = {

      }

      s += '<line x1="' + a + '" y1="100" x2="' + b + '" y2="100" stroke="#FF8A3D" stroke-width="8" stroke-linecap="round"/>';

      s += '<circle cx="' + px(x) + '" cy="150" r="12" fill="#22B573" stroke="#fff" stroke-width="3"/>';
      s += '<circle cx="' + px(-x) + '" cy="150" r="9" fill="#fff" stroke="#22B573" stroke-width="3" stroke-dasharray="4 3"/>';
      r.querySelector("#sv").innerHTML = s;
      r.querySelector("#av").innerHTML = "| " + x + " | = " + Math.abs(x);
      r.querySelector("#tx").innerHTML = x === 0 ? "0의 절댓값은 0이에요"

  }
};

var D0 = [7, 8, 8, 9, 10, 10, 10, 12, 13, 21];
function barBoard(data, hi, meanLine) {
  var W = 560, Hh = 260, pad = 34, n = data.length, bw = (W - pad * 2) / n;
  var mx = Math.max.apply(null, data.concat([20]));

    s += '<line x1="' + pad + '" y1="' + y(meanLine) + '" x2="' + (W - pad) + '" y2="' + y(meanLine) +
      '" stroke="#FF8A3D" stroke-width="4" stroke-dasharray="10 7"/>';
    s += '<text x="' + (W - pad) + '" y="' + (y(meanLine) - 10) + '" text-anchor="end" class="svgt" fill="#FF8A3D">평균 ' + H.r2(meanLine) + "</text>";
  }
  data.forEach(function (v, i) {
    var x = pad + bw * i + 3, on = hi && hi.indexOf(i) >= 0;
    s += '<rect x="' + x + '" y="' + y(v) + '" width="' + (bw - 6) + '" height="' + (Hh - 30 - y(v)) +

}

var CLS_A = [148,151,152,155,155,156,157,158,158,159,160,160,161,161,162,163,163,164,165,165,166,167,168,169,170,171,172,174,176,178];
var CLS_B = [150,153,154,157,158,159,160,161,162,163,164,165,166,168,169,171,173,175,177,180];
function bins(data, size, lo) {
  var hi = Math.max.apply(null, data), out = [];
  for (var s = lo; s < hi + size; s += size) {
    out.push({ from: s, to: s + size, f: data.filter(function (v) { return v >= s && v < s + size; }).length });
    if (s + size > hi) break;
  }
  return out;
}

  html: '<div class="dm"><div class="dv"><svg id="sv" class="dsvg" viewBox="0 0 600 320"></svg></div>' +
    '<div class="dc"><div class="cd"><h4>계급의 크기</h4>' + H.seg("s", [[3, "3"], [5, "5"], [10, "10"]], 5) + "</div>" +
    '<div class="cd" style="max-height:320px;overflow:auto"><h4>도수분포표 · 30명</h4>' +
    '<table class="t"><tbody id="tb"></tbody></table></div>' +
    '<p class="bb">계급의 크기를 바꾸면 <b>같은 자료인데 그래프 모양이 달라져요</b>. 너무 크면 뭉뚱그려지고 너무 작으면 들쭉날쭉해집니다.</p></div></div>',
  init: function (r) {
    var size = 5;
    function draw() {
      var a = bins(CLS_A, size, 145), W = 600, Hh = 320, pad = 46;
      var bw = (W - pad * 2) / a.length, mx = Math.max.apply(null, a.map(function (x) { return x.f; })) * 1.15;
      var y = function (v) { return Hh - pad - v / mx * (Hh - pad * 2); };
      var s = "";
      a.forEach(function (b, i) {
        s += '<rect x="' + (pad + bw * i) + '" y="' + y(b.f) + '" width="' + bw + '" height="' + (Hh - pad - y(b.f)) +
          '" fill="#B9E4CE" stroke="#22B573" stroke-width="3"/>';
        s += '<text x="' + (pad + bw * (i + 0.5)) + '" y="' + (Hh - pad + 22) + '" text-anchor="middle" class="svgn sm">' + b.from + "</text>";
        if (b.f) s += '<text x="' + (pad + bw * (i + 0.5)) + '" y="' + (y(b.f) - 8) + '" text-anchor="middle" class="svgn sm">' + b.f + "</text>";
      });
      s += '<line x1="' + pad + '" y1="' + (Hh - pad) + '" x2="' + (W - pad) + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      s += '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      s += '<text x="' + (pad - 8) + '" y="' + (pad + 4) + '" text-anchor="end" class="svgn sm">명</text>';
      r.querySelector("#sv").innerHTML = s;
      r.querySelector("#tb").innerHTML = "<tr><th>계급 (cm)</th><th>도수</th></tr>" + a.map(function (b) {
        return '<tr><td class="eq">' + b.from + " 이상 ~ " + b.to + ' 미만</td><td class="eq">' + b.f + "</td></tr>";
      }).join("");
    }
    H.onSeg(r, "s", function (v) { size = +v; draw(); });
    draw();
  }
};

DEMOS["도수분포다각형"] = {
  html: '<div class="dm"><div class="dv"><svg id="sv" class="dsvg" viewBox="0 0 600 320"></svg></div>' +
    '<div class="dc"><div class="cd"><h4>보이기</h4>' +
    H.seg("m", [["h", "히스토그램만"], ["b", "함께 보기"], ["p", "다각형만"]], "b") + "</div>" +
    '<div class="cd"><h4>그리는 법</h4><p class="s1" style="line-height:1.9">① 각 직사각형 윗변의 <b>중점</b>을 찍어요<br>② 양 끝에 도수 0인 계급을 하나씩 더해요<br>③ 점들을 선분으로 이어요</p></div>' +
    '<p class="bb">다각형과 가로축으로 둘러싸인 <b>넓이는 히스토그램의 넓이와 같아요</b>. 두 자료를 겹쳐 비교할 때 특히 편리합니다.</p></div></div>',
  init: function (r) {
    var mode = "b";
    function draw() {
      var a = bins(CLS_A, 5, 145), W = 600, Hh = 320, pad = 46;
      var bw = (W - pad * 2) / (a.length + 2), mx = Math.max.apply(null, a.map(function (x) { return x.f; })) * 1.2;
      var y = function (v) { return Hh - pad - v / mx * (Hh - pad * 2); };
      var s = "", pts = [[pad + bw * 0.5, y(0)]];
      a.forEach(function (b, i) {
        var x = pad + bw * (i + 1);
        if (mode !== "p") s += '<rect x="' + x + '" y="' + y(b.f) + '" width="' + bw + '" height="' + (Hh - pad - y(b.f)) +
          '" fill="#B9E4CE" stroke="#22B573" stroke-width="3" opacity="' + (mode === "b" ? .75 : 1) + '"/>';
        s += '<text x="' + (x + bw / 2) + '" y="' + (Hh - pad + 22) + '" text-anchor="middle" class="svgn sm">' + b.from + "</text>";
        pts.push([x + bw / 2, y(b.f)]);
      });
      pts.push([pad + bw * (a.length + 1.5), y(0)]);
      if (mode !== "h") {
        s += '<polyline points="' + pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ") +
          '" fill="none" stroke="#0E8A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
        pts.forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="#0E8A55"/>'; });
      }
      s += '<line x1="' + pad + '" y1="' + (Hh - pad) + '" x2="' + (W - pad) + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      s += '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      r.querySelector("#sv").innerHTML = s;
    }
    H.onSeg(r, "m", function (v) { mode = v; draw(); });
    draw();
  }
};

DEMOS["상대도수"] = {
  html: '<div class="dm"><div class="dv"><svg id="sv" class="dsvg" viewBox="0 0 600 320"></svg></div>' +
    '<div class="dc"><div class="cd"><h4>보이기</h4>' +
    H.seg("m", [["f", "도수"], ["r", "상대도수"], ["c", "두 반 비교"]], "f") + "</div>" +
    '<div class="cd" style="max-height:300px;overflow:auto"><h4>표</h4><table class="t"><tbody id="tb"></tbody></table></div>' +
    '<div class="vd o" id="msg"></div>' +
    '<p class="bb">상대도수는 <b>그 계급의 도수 ÷ 전체 도수</b>예요. 합은 항상 1이 되고, 인원수가 다른 두 집단을 나란히 비교할 수 있습니다.</p></div></div>',
  init: function (r) {
    var mode = "f";
    function draw() {
      var a = bins(CLS_A, 5, 145), b = bins(CLS_B, 5, 145);
      var W = 600, Hh = 320, pad = 46, bw = (W - pad * 2) / a.length;
      var rel = mode !== "f";
      var mx = rel ? Math.max(Math.max.apply(null, a.map(function (x) { return x.f / CLS_A.length; })),
                              Math.max.apply(null, b.map(function (x) { return x.f / CLS_B.length; }))) * 1.2
                   : Math.max.apply(null, a.map(function (x) { return x.f; })) * 1.2;
      var y = function (v) { return Hh - pad - v / mx * (Hh - pad * 2); };
      var val = function (bin, t) { return rel ? bin.f / t : bin.f; };
      var s = "";
      a.forEach(function (bin, i) {
        s += '<rect x="' + (pad + bw * i + 2) + '" y="' + y(val(bin, CLS_A.length)) + '" width="' + (bw - 4) +
          '" height="' + (Hh - pad - y(val(bin, CLS_A.length))) + '" rx="4" fill="#B9E4CE" stroke="#22B573" stroke-width="3"/>';
        s += '<text x="' + (pad + bw * (i + 0.5)) + '" y="' + (Hh - pad + 22) + '" text-anchor="middle" class="svgn sm">' + bin.from + "</text>";
      });
      if (mode === "c") {
        s += '<polyline points="' + b.map(function (bin, i) { return (pad + bw * (i + 0.5)) + "," + y(val(bin, CLS_B.length)); }).join(" ") +
          '" fill="none" stroke="#FF5F8F" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round"/>';
        s += '<text x="' + (W - pad) + '" y="' + (pad + 6) + '" text-anchor="end" class="svgt" fill="#FF5F8F">2반 20명</text>';
        s += '<text x="' + (W - pad) + '" y="' + (pad + 30) + '" text-anchor="end" class="svgt" fill="#22B573">1반 30명</text>';
      }
      s += '<line x1="' + pad + '" y1="' + (Hh - pad) + '" x2="' + (W - pad) + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      s += '<line x1="' + pad + '" y1="' + pad + '" x2="' + pad + '" y2="' + (Hh - pad) + '" stroke="#2B3A67" stroke-width="3"/>';
      r.querySelector("#sv").innerHTML = s;
      var sum = 0;
      r.querySelector("#tb").innerHTML = "<tr><th>계급 (cm)</th><th>도수</th><th>상대도수</th></tr>" +
        a.map(function (bin) {
          var rv = bin.f / CLS_A.length; sum += rv;
          return '<tr><td class="eq">' + bin.from + "~" + bin.to + '</td><td class="eq">' + bin.f +
            '</td><td class="eq hot">' + H.r2(rv) + "</td></tr>";
        }).join("") + '<tr><th>합</th><th class="eq">' + CLS_A.length + '</th><th class="eq">' + H.r2(sum) + "</th></tr>";
      r.querySelector("#msg").textContent = mode === "c"
        ? "1반 30명, 2반 20명 · 인원이 달라도 상대도수로 보면 나란히 비교할 수 있어요"
        : mode === "r" ? "상대도수의 합은 언제나 1이에요" : "도수는 그 계급에 속한 자료의 개수예요";
    }
    H.onSeg(r, "m", function (v) { mode = v; draw(); });
    draw();
  }
};


(function () {
var FLAT = [];
GRADES.forEach(function (g) {
  g.units.forEach(function (u, ui) {
    u.no = ui + 1;
    u.items.forEach(function (it, ii) {
      FLAT.push({ gid:g.id, ui:ui, ii:ii, name:it, unit:u.title, area:u.area });
    });
  });
});
var st = { gid:1, ui:0, ii:0 }, tmp = { gid:1, ui:0 };
var $ = function (id) { return document.getElementById(id); };
var G = function (id) { for (var i=0;i<GRADES.length;i++) if (GRADES[i].id===id) return GRADES[i]; };
var esc = function (s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };
function cur() { var g=G(st.gid), u=g.units[st.ui]; return {g:g,u:u,it:u.items[st.ii],A:AREAS[u.area]}; }
function flatOf(gid) { return FLAT.filter(function (f) { return f.gid===gid; }); }
function idx() { var f=flatOf(st.gid); for (var i=0;i<f.length;i++) if (f[i].ui===st.ui&&f[i].ii===st.ii) return i; return 0; }

function renderHead() {
  var c = cur();
  $("app").style.setProperty("--g", c.g.color);
  $("app").style.setProperty("--gd", c.g.dark);
  $("pGrade").textContent = c.g.label;
  $("pUno").textContent = ("0"+c.u.no).slice(-2);
  $("pUnit").textContent = c.u.title;
  $("pItem").textContent = c.it;
}
function renderSlot() {
  var c = cur(), d = DEMOS[c.it];
  var head = '<div class="slot-head"><h1>'+esc(c.it)+"</h1>" +
    '<p class="crumb">'+c.g.label+" · "+esc(c.u.title)+"</p>" +
    (d ? "" : '<span class="badge card">▤ 개념 카드 예정</span>') + "</div>";
  if (d) {
    $("slot").innerHTML = head + d.html;
    try { d.init($("slot")); } catch (e) {
      $("slot").innerHTML = head + '<div class="ph"><p>화면을 그리는 중 문제가 생겼어요<br>'+esc(e.message)+"</p></div>";
    }
  } else {
    $("slot").innerHTML = head +
      '<div class="ph"><span class="ic">▤</span><p><b>'+esc(c.it)+"</b> 개념 카드가 이 자리에 들어갑니다.<br>" +
      "정의 · 공식 · 예시 · 흔한 실수 순서로 정리됩니다.</p></div>";
  }
}
function renderSheet() {
  var c = cur();
  $("sheet").innerHTML = "<h3>성취기준</h3><ul>" + c.u.std.map(function (s) {
    return "<li><span class='code' style='background:"+c.A.soft+";color:"+c.A.color+"'>"+s[0]+"</span><span>"+esc(s[1])+"</span></li>";
  }).join("") + "</ul><h3>이 단원의 세부항목 "+c.u.items.length+"개</h3><div class='tags'>" +
  c.u.items.map(function (it,i) {
    return "<span class='tag'"+(i===st.ii?" style='background:"+c.A.soft+";color:"+c.A.color+";border-color:"+c.A.color+"'":"")+">"+esc(it)+"</span>";
  }).join("") + "</div>";
}
function renderFoot() {
  var c = cur();
  $("dots").innerHTML = c.u.items.map(function (it,i) {
    return '<button class="dot'+(i===st.ii?" on":"")+'" data-i="'+i+'" title="'+esc(it)+'">'+(i+1)+"</button>";
  }).join("");
  var flat=flatOf(st.gid), at=idx();
  $("meter").innerHTML = c.g.label+" <b>"+(at+1)+"</b> / "+flat.length+
    '<span class="bar"><i style="width:'+((at+1)/flat.length*100)+'%"></i></span>';
  $("prev").disabled = at===0; $("next").disabled = at===flat.length-1;
}
function render() { renderHead(); renderSlot(); renderFoot(); if ($("sheet").classList.contains("open")) renderSheet(); }
function go(g,u,i) { st={gid:g,ui:u,ii:i}; render(); }
function step(d) { var f=flatOf(st.gid), t=f[idx()+d]; if (t) go(t.gid,t.ui,t.ii); }

function openHome(){ $("home").classList.add("open"); closePicker(); }
function closeHome(){ $("home").classList.remove("open"); }
function openPicker() {
  tmp={gid:st.gid,ui:st.ui}; $("q").value="";
  $("hits").style.display="none"; $("cols").style.display="grid";
  $("picker").classList.add("open"); renderCols();
}
function closePicker(){ $("picker").classList.remove("open"); }
function renderCols() {
  var tg=G(tmp.gid);
  $("colG").innerHTML = '<p class="ctitle">학년</p>' + GRADES.map(function (g) {
    var on=g.id===tmp.gid;
    return '<button class="opt'+(on?" cur":"")+'" data-g="'+g.id+'"'+(on?' style="background:'+g.color+'"':"")+"><span>"+g.label+"</span></button>";
  }).join("");
  $("colU").innerHTML = '<p class="ctitle">단원 '+tg.units.length+"개</p>" + tg.units.map(function (u,i) {
    var A=AREAS[u.area], on=i===tmp.ui;
    return '<button class="opt'+(on?" sel":"")+'" data-u="'+i+'" style="color:'+(on?A.color:"#2B3A67")+'">'+
      '<span class="ad" style="background:'+A.color+'"></span><span class="n">'+u.no+"</span>"+
      "<span>"+esc(u.title)+'</span><span class="c">'+u.items.length+"</span></button>";
  }).join("");
  var u=tg.units[tmp.ui], A=AREAS[u.area];
  $("colI").innerHTML = '<p class="ctitle">세부항목 '+u.items.length+"개</p>" + u.items.map(function (it,i) {
    var on = tmp.gid===st.gid && tmp.ui===st.ui && i===st.ii;
    return '<button class="opt'+(on?" cur":"")+'" data-i="'+i+'"'+(on?' style="background:'+A.color+'"':"")+">"+
      '<span class="n">'+(i+1)+"</span><span>"+esc(it)+"</span></button>";
  }).join("");
}
function search(kw) {
  kw=kw.trim();
  if (!kw) { $("hits").style.display="none"; $("cols").style.display="grid"; return; }
  $("cols").style.display="none"; $("hits").style.display="block";
  var hits=FLAT.filter(function(f){return f.name.indexOf(kw)>=0||f.unit.indexOf(kw)>=0;}).slice(0,40);
  $("hits").innerHTML = hits.length ? hits.map(function (f) {
    var g=G(f.gid), A=AREAS[f.area];
    return '<button class="hit" data-g="'+f.gid+'" data-u="'+f.ui+'" data-i="'+f.ii+'">'+
      '<span class="gb" style="background:'+A.soft+";color:"+g.color+'">'+g.label+"</span><span>"+esc(f.name)+
      '</span><span class="pth">'+esc(f.unit)+"</span></button>";
  }).join("") : '<p class="nohit">‘'+esc(kw)+"’ 에 해당하는 항목이 없어요</p>";
}

$("homeBtn").addEventListener("click", openHome);
$("home").addEventListener("click", function (e) {
  var b=e.target.closest("button[data-lv]"); if (!b) return;
  if (b.dataset.lv==="mid") { closeHome(); return; }
  var t=b.querySelector(".sm"), old=t.textContent;
  t.textContent="아직 준비 중이에요";
  setTimeout(function(){ t.textContent=old; }, 1400);
});
$("posBtn").addEventListener("click", openPicker);
$("closeP").addEventListener("click", closePicker);
$("colG").addEventListener("click", function (e) { var b=e.target.closest("button[data-g]"); if (b) { tmp={gid:+b.dataset.g,ui:0}; renderCols(); } });
$("colU").addEventListener("click", function (e) { var b=e.target.closest("button[data-u]"); if (b) { tmp.ui=+b.dataset.u; renderCols(); } });
$("colI").addEventListener("click", function (e) { var b=e.target.closest("button[data-i]"); if (b) { go(tmp.gid,tmp.ui,+b.dataset.i); closePicker(); } });
$("hits").addEventListener("click", function (e) { var b=e.target.closest("button[data-g]"); if (b) { go(+b.dataset.g,+b.dataset.u,+b.dataset.i); closePicker(); } });
$("q").addEventListener("input", function () { search(this.value); });
$("dots").addEventListener("click", function (e) { var b=e.target.closest("button[data-i]"); if (b) go(st.gid,st.ui,+b.dataset.i); });
$("prev").addEventListener("click", function () { step(-1); });
$("next").addEventListener("click", function () { step(1); });
$("infoBtn").addEventListener("click", function () {
  var open=$("sheet").classList.toggle("open"); this.classList.toggle("on",open); if (open) renderSheet();
});
document.addEventListener("touchmove", function (e) {
  var t=e.target;
  if (t && t.closest && t.closest("input, .col, .hits, .sheet, .dots, .dc, .slot")) return;
  if (e.cancelable) e.preventDefault();
}, { passive:false });

window.__render = render;
render();
})();
</script>
</body>
</html>
