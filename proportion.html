*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#F2F6FF;
  overscroll-behavior:none;touch-action:pan-y;}
body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;}

.app{--ink:#2B3A67;--ink-soft:#7E8CB5;--line:#D8E2F7;--paper:#F2F6FF;--card:#fff;
  --purple:#9B6BE8;--purple-d:#7B4CC8;--orange:#FF8A3D;--orange-d:#D96C23;
  --green:#22B573;--tone:var(--purple);--tone-d:var(--purple-d);--soft:#F0E8FF;
  height:100%;display:flex;flex-direction:column;
  font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);}
.app.inverse{--tone:var(--orange);--tone-d:var(--orange-d);--soft:#FFEEE0;}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
.num{font-family:'Fredoka','Gowun Dodum',sans-serif;font-weight:500;}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;}

.top{flex:none;display:flex;align-items:center;gap:14px;padding:9px 16px;
  background:var(--card);border-bottom:2px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;}
.icon{width:38px;height:38px;border-radius:13px;background:var(--tone);color:#fff;
  display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 var(--tone-d);}
.brand b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:18px;}
.brand em{display:block;font-style:normal;font-size:11px;color:var(--ink-soft);}
.seg{display:flex;background:var(--paper);border:2.5px solid var(--line);
  border-radius:16px;padding:4px;gap:4px;margin-left:auto;}
.seg button{min-height:44px;padding:0 16px;border:0;border-radius:12px;
  background:transparent;font-family:'Jua',sans-serif;font-size:14px;color:var(--ink-soft);}
.seg button.on{background:var(--tone);color:#fff;}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;
  gap:16px;padding:12px 16px;}
.board{background:var(--card);border:2.5px solid var(--line);border-radius:22px;
  padding:10px;min-height:0;display:flex;}
#plane{width:100%;height:100%;display:block;}
.side{min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}

.card{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:12px 14px;}
.card.tone{border-left:6px solid var(--tone);}
.card h3{margin:0 0 6px;font-size:12px;font-weight:400;color:var(--ink-soft);}
.card p{margin:3px 0;}
.eq{font-size:26px;}
.big{font-size:30px;color:var(--tone);}
.mid{font-size:17px;}

.slider{display:flex;flex-direction:column;gap:5px;}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;}
.slider label{font-size:13px;color:var(--ink-soft);}
.slider .val{font-size:21px;color:var(--tone);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;
  border-radius:999px;background:var(--line);outline:none;touch-action:pan-x;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;
  border-radius:50%;background:var(--tone);border:4px solid #fff;
  box-shadow:0 2px 6px rgba(43,58,103,.3);}
input[type=range]::-moz-range-thumb{width:36px;height:36px;border-radius:50%;
  background:var(--tone);border:4px solid #fff;}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{min-height:46px;padding:0 16px;border-radius:14px;border:2.5px solid var(--line);
  background:var(--card);font-family:'Jua',sans-serif;font-size:14px;
  box-shadow:0 4px 0 var(--line);}
.btn:active{transform:translateY(4px);box-shadow:none;}
.btn.on{background:var(--tone);border-color:var(--tone);color:#fff;box-shadow:0 4px 0 var(--tone-d);}

table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{border:2px solid var(--line);padding:5px 3px;text-align:center;}
th{background:var(--paper);color:var(--ink-soft);font-weight:400;font-size:12px;}
td.hi{color:var(--tone);}

.bubble{background:var(--paper);border-left:5px solid var(--tone);
  border-radius:0 14px 14px 0;padding:11px 13px;font-size:13.5px;line-height:1.75;margin:0;}
.svg-num{font-family:'Fredoka',sans-serif;font-size:16px;fill:#7E8CB5;
  paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;}
.svg-tag{font-family:'Jua',sans-serif;font-size:19px;
  paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;}
  .side{flex-direction:row;overflow-x:auto;}
  .side>*{flex:0 0 240px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="icon">▧</span>
      <span><b>정비례와 반비례</b><em>직사각형으로 보기 · 중1 수학 · v1</em></span>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="direct" class="on">정비례 · 모양이 그대로</button>
      <button data-mode="inverse">반비례 · 넓이가 그대로</button>
    </div>
  </header>

  <main class="stage">
    <div class="board"><svg id="plane" viewBox="0 0 580 560"></svg></div>

    <aside class="side">
      <div class="card">
        <div class="slider">
          <div class="row"><label>가로 x</label><span class="val num" id="xVal">3</span></div>
          <input type="range" id="xRange" min="1" max="10" step="0.5" value="3" />
        </div>
      </div>

      <div class="card">
        <div class="slider">
          <div class="row"><label id="aLabel">비례상수 a</label><span class="val num" id="aVal">1.5</span></div>
          <input type="range" id="aRange" min="0.5" max="3" step="0.5" value="1.5" />
        </div>
      </div>

      <div class="card tone">
        <h3 id="invTitle">언제나 일정한 것</h3>
        <p class="num big" id="invLine">높이 ÷ 가로 = 1.5</p>
        <p class="num mid" id="eqLine">y = 1.5x</p>
      </div>

      <div class="card">
        <h3>대응표</h3>
        <table><tbody>
          <tr id="rowX"><th>x</th></tr>
          <tr id="rowY"><th>y</th></tr>
        </tbody></table>
      </div>

      <div class="btn-row">
        <button class="btn" id="ghostBtn">비교 직사각형 켜기</button>
        <button class="btn" id="clearBtn">자취 지우기</button>
      </div>

      <p class="bubble" id="tip"></p>
    </aside>
  </main>
</div>

<script>
(function () {
  var app = document.getElementById("app");
  var svg = document.getElementById("plane");
  var xR = document.getElementById("xRange"), aR = document.getElementById("aRange");
  var mode = "direct", ghost = true, trail = [];

  var R = 10, OX = 66, OY = 502, U = 43;          // 좌표 0~10, 한 칸 43px
  function px(v) { return OX + v * U; }
  function py(v) { return OY - v * U; }
  function r1(v) { return Math.round(v * 10) / 10; }
  function fmt(v) { return Number.isInteger(v) ? v : r1(v); }

  // 모드별 a 슬라이더 설정
  var CFG = {
    direct:  { min: 0.5, max: 3,  step: 0.5, val: 1.5, label: "비례상수 a  (높이 ÷ 가로)" },
    inverse: { min: 4,   max: 20, step: 2,   val: 12,  label: "비례상수 a  (넓이)" }
  };

  function yOf(x, a) { return mode === "direct" ? a * x : a / x; }

  // y 가 10을 넘지 않는 x 범위
  function xRange(a) {
    if (mode === "direct") return [1, Math.min(10, Math.floor((R / a) * 2) / 2)];
    return [Math.ceil((a / R) * 2) / 2, 10];
  }

  function setMode(m) {
    mode = m;
    app.className = "app" + (m === "inverse" ? " inverse" : "");
    var c = CFG[m];
    aR.min = c.min; aR.max = c.max; aR.step = c.step; aR.value = c.val;
    document.getElementById("aLabel").textContent = c.label;
    var lim = xRange(c.val);
    xR.min = lim[0]; xR.max = lim[1];
    xR.value = Math.min(Math.max(3, lim[0]), lim[1]);
    trail = [];
    [].forEach.call(document.querySelectorAll("#modeSeg button"), function (b) {
      b.className = b.dataset.mode === m ? "on" : "";
    });
    draw();
  }

  function draw() {
    var a = parseFloat(aR.value);
    var lim = xRange(a);
    if (parseFloat(xR.min) !== lim[0] || parseFloat(xR.max) !== lim[1]) {
      xR.min = lim[0]; xR.max = lim[1];
      if (parseFloat(xR.value) < lim[0]) xR.value = lim[0];
      if (parseFloat(xR.value) > lim[1]) xR.value = lim[1];
      trail = [];
    }
    var x = parseFloat(xR.value), y = yOf(x, a);

    // 자취 기록
    if (!trail.some(function (p) { return Math.abs(p[0] - x) < 0.01; })) trail.push([x, y]);

    var s = [];

    // 모눈
    for (var i = 0; i <= R; i++) {
      s.push('<line x1="' + px(i) + '" y1="' + py(0) + '" x2="' + px(i) + '" y2="' + py(R) + '" stroke="#E3EAF9" stroke-width="1.5"/>');
      s.push('<line x1="' + px(0) + '" y1="' + py(i) + '" x2="' + px(R) + '" y2="' + py(i) + '" stroke="#E3EAF9" stroke-width="1.5"/>');
    }

    // 비교(고스트) 직사각형 — 성질이 유지되는 다른 경우
    if (ghost) {
      var others = mode === "direct" ? [x / 2, x * 1.6] : [x / 2, x * 2];
      others.forEach(function (gx) {
        gx = Math.round(gx * 2) / 2;
        if (gx < lim[0] || gx > lim[1] || Math.abs(gx - x) < 0.4) return;
        var gy = yOf(gx, a);
        if (gy > R) return;
        s.push('<rect x="' + px(0) + '" y="' + py(gy) + '" width="' + gx * U + '" height="' + gy * U +
          '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.4"/>');
      });
    }

    // 주 직사각형
    s.push('<rect x="' + px(0) + '" y="' + py(y) + '" width="' + x * U + '" height="' + y * U +
      '" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="4" rx="3"/>');

    // 정비례는 대각선(기울기 일정), 반비례는 넓이 표시
    if (mode === "direct") {
      s.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(x) + '" y2="' + py(y) +
        '" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6"/>');
    } else {
      s.push('<text x="' + px(x / 2) + '" y="' + (py(y / 2) + 8) + '" text-anchor="middle" class="svg-tag" fill="currentColor">' + fmt(x * y) + '</text>');
      s.push('<text x="' + px(x / 2) + '" y="' + (py(y / 2) - 16) + '" text-anchor="middle" class="svg-num" fill="currentColor">넓이</text>');
    }

    // 그래프(자취) 곡선
    var path = "";
    if (mode === "direct") {
      path = "M " + px(0) + " " + py(0) + " L " + px(lim[1]) + " " + py(a * lim[1]);
    } else {
      for (var t = lim[0]; t <= 10.001; t += 0.1) {
        var yy = a / t;
        if (yy > R) continue;
        path += (path ? " L " : "M ") + px(t) + " " + py(yy);
      }
    }
    s.push('<path d="' + path + '" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.85"/>');

    // 지나온 점
    trail.forEach(function (p) {
      if (Math.abs(p[0] - x) < 0.01) return;
      s.push('<circle cx="' + px(p[0]) + '" cy="' + py(p[1]) + '" r="5" fill="#7E8CB5" opacity="0.5"/>');
    });

    // 축
    s.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + (px(R) + 22) + '" y2="' + py(0) + '" stroke="#2B3A67" stroke-width="3.5"/>');
    s.push('<line x1="' + px(0) + '" y1="' + py(0) + '" x2="' + px(0) + '" y2="' + (py(R) - 22) + '" stroke="#2B3A67" stroke-width="3.5"/>');
    for (var k = 2; k <= R; k += 2) {
      s.push('<text x="' + px(k) + '" y="' + (py(0) + 26) + '" text-anchor="middle" class="svg-num">' + k + '</text>');
      s.push('<text x="' + (px(0) - 14) + '" y="' + (py(k) + 6) + '" text-anchor="end" class="svg-num">' + k + '</text>');
    }
    s.push('<text x="' + (px(R) + 30) + '" y="' + (py(0) + 6) + '" class="svg-tag" fill="#7E8CB5">x</text>');
    s.push('<text x="' + (px(0) - 4) + '" y="' + (py(R) - 30) + '" class="svg-tag" fill="#7E8CB5">y</text>');

    // 꼭짓점 = 그래프 위의 점
    s.push('<circle cx="' + px(x) + '" cy="' + py(y) + '" r="12" fill="currentColor" stroke="#fff" stroke-width="4"/>');
    s.push('<text x="' + (px(x) + 18) + '" y="' + (py(y) - 16) + '" class="svg-tag" fill="currentColor">(' + fmt(x) + ', ' + fmt(y) + ')</text>');

    // 가로는 x좌표 오른쪽에, 높이는 y좌표 위쪽에 (넓이 라벨과 겹치지 않도록)
    s.push('<text x="' + (px(x) + 12) + '" y="' + (py(0) - 12) + '" text-anchor="start" class="svg-num" fill="#2B3A67">가로 ' + fmt(x) + '</text>');
    s.push('<text x="' + (px(0) + 10) + '" y="' + (py(y) - 14) + '" text-anchor="start" class="svg-num" fill="#2B3A67">높이 ' + fmt(y) + '</text>');

    svg.innerHTML = s.join("");
    svg.style.color = mode === "direct" ? "#9B6BE8" : "#FF8A3D";

    // 오른쪽 패널
    document.getElementById("xVal").textContent = fmt(x);
    document.getElementById("aVal").textContent = fmt(a);
    document.getElementById("invTitle").textContent =
      mode === "direct" ? "모양이 그대로 · 언제나 일정한 것" : "넓이가 그대로 · 언제나 일정한 것";
    document.getElementById("invLine").textContent =
      mode === "direct" ? "높이 ÷ 가로 = " + fmt(y / x) : "가로 × 높이 = " + fmt(x * y);
    document.getElementById("eqLine").textContent =
      mode === "direct" ? "y = " + fmt(a) + "x" : "y = " + fmt(a) + " ÷ x";

    // 대응표
    var rowX = document.getElementById("rowX"), rowY = document.getElementById("rowY");
    rowX.innerHTML = "<th>x</th>"; rowY.innerHTML = "<th>y</th>";
    var picks = [];
    for (var v = Math.ceil(lim[0]); v <= lim[1] && picks.length < 5; v++) {
      if (mode === "inverse" && a % v !== 0) continue;
      picks.push(v);
    }
    if (picks.length < 3) { picks = []; for (var v2 = Math.ceil(lim[0]); v2 <= lim[1] && picks.length < 5; v2++) picks.push(v2); }
    picks.forEach(function (v) {
      rowX.insertAdjacentHTML("beforeend", '<td class="num">' + v + "</td>");
      rowY.insertAdjacentHTML("beforeend", '<td class="num hi">' + fmt(yOf(v, a)) + "</td>");
    });

    document.getElementById("tip").innerHTML = mode === "direct"
      ? "가로를 2배로 늘리면 높이도 2배가 되어 <b>직사각형 모양이 그대로</b>예요. 원점에서 꼭짓점까지 이은 점선의 기울기가 변하지 않죠. 그래서 꼭짓점이 지나간 자리는 <b>원점을 지나는 직선</b>이 됩니다."
      : "가로를 2배로 늘리면 높이는 절반이 되어 <b>넓이가 그대로</b>예요. 가로 × 높이가 항상 " + fmt(a) + "이라서, 꼭짓점이 지나간 자리는 축에 닿지 않는 <b>부드러운 곡선</b>이 됩니다.";
  }

  document.getElementById("modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mode]");
    if (b) setMode(b.dataset.mode);
  });
  xR.addEventListener("input", draw);
  aR.addEventListener("input", function () { trail = []; draw(); });
  document.getElementById("clearBtn").addEventListener("click", function () { trail = []; draw(); });
  document.getElementById("ghostBtn").addEventListener("click", function () {
    ghost = !ghost;
    this.textContent = ghost ? "비교 직사각형 끄기" : "비교 직사각형 켜기";
    this.className = "btn" + (ghost ? " on" : "");
    draw();
  });

  // 좌우 스와이프 제스처 차단
  document.addEventListener("touchmove", function (e) {
    var t = e.target;
    if (t && t.closest && t.closest("input, .side")) return;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  document.getElementById("ghostBtn").className = "btn on";
  document.getElementById("ghostBtn").textContent = "비교 직사각형 끄기";
  setMode("direct");
})();
</script>
</body>
</html>
